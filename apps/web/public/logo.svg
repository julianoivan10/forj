<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forj logo">
  <title>Forj</title>
  <!-- Ink block: the work. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="3" fill="#16150F" stroke="#57564F" stroke-width="1"/>
  <!-- Paper F: the product mark. Stem, long arm, shorter middle bar. -->
  <g fill="#F3F1EC">
    <rect x="9" y="6" width="3.5" height="17"/>
    <rect x="9" y="6" width="15" height="3.5"/>
    <rect x="9" y="13.5" width="9.5" height="3"/>
  </g>
  <!-- Cobalt bar: the contract layer the work sits on. -->
  <rect x="5" y="25" width="22" height="2.5" fill="#1F3FD1"/>
</svg>
